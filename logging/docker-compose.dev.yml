services:
  alloy:
    image: grafana/alloy:v1.11.0
    container_name: alloy
    labels:
      - logging=off
    ports:
      - 12345:12345
    environment:
      DOCKER_HOST: tcp://host.docker.internal:2375
    volumes:
      - ./alloy/config.dev.alloy:/etc/alloy/config.alloy:ro
      - ./alloy/.alloy-data:/var/lib/alloy/data
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy

  grafana:
    image: grafana/grafana:12.2
    container_name: grafana
    labels:
      - logging=off
    ports:
      - 3000:3000
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
        apiVersion: 1
        datasources:
          - name: Loki
            type: loki
            access: proxy
            url: http://loki:3100
            jsonData:
              timeout: 60
              maxLines: 1000
        EOF
        /run.sh
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.5
    container_name: loki
    labels:
      - logging=off
    ports:
      - 3100
      - 7946
    command: "-config.file=/etc/loki/config.yaml -target=all -legacy-read-mode=false"
    volumes:
      - ./loki/config.dev.yml:/etc/loki/config.yaml
      - ./loki/.loki-data:/var/loki
