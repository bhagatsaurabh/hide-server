apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        logging: "off"
    spec:
      securityContext:
        fsGroup: 472
      initContainers:
        - name: fs-perm
          image: busybox
          command: ["sh", "-c", "chown -R 472:472 /var/lib/grafana"]
          volumeMounts:
            - mountPath: /var/lib/grafana
              name: data
      containers:
        - name: grafana
          image: grafana/grafana:12.2
          ports:
            - containerPort: 3000
          env:
            - name: GRAFANA_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hide-secrets
                  key: GRAFANA_GITHUB_CLIENT_ID
            - name: GRAFANA_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hide-secrets
                  key: GRAFANA_GITHUB_CLIENT_SECRET
          volumeMounts:
            - name: config
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
            - name: data
              mountPath: /var/lib/grafana
          resources:
            limits:
              cpu: 75m
              memory: 256Mi
            requests:
              cpu: 75m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: grafana-config
        - name: data
          persistentVolumeClaim:
            claimName: grafana-pvc
