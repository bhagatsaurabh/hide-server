apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: default
data:
  grafana.ini: |
    [server]
    domain = grafana.hide.saurabhagat.me
    root_url = https://grafana.hide.saurabhagat.me/

    [users]
    default_theme=light

    [auth]
    disable_login_form=true
    oauth_auto_login=true

    [auth.github]
    enabled = true
    client_id = ${GRAFANA_GITHUB_CLIENT_ID}
    client_secret = ${GRAFANA_GITHUB_CLIENT_SECRET}
    scopes = user:email,read:org
    auth_url = https://github.com/login/oauth/authorize
    token_url = https://github.com/login/oauth/access_token
    api_url = https://api.github.com/user
    allow_sign_up = false
    auto_login = false
    role_attribute_path = [login=='bhagatsaurabh'][0] && 'Admin'
