services:
  env:
    expose:
      - 80
    build:
      context: ../
      dockerfile: env/dockerfile
      target: development
    image: hide-server-env
    volumes:
      - .:/app/env
      - /app/env/node_modules
    environment:
      - NODE_ENV=development
      - SERVICE_PORT=80
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RMQ_URL=amqp://rabbitmq:5672
      - NATS_URL=nats://nats:4222
    command: ['/bin/sh', '-c', 'cd env && npm run start:dev']
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 0.5g
        reservations:
          cpus: '0.4'
          memory: 0.5g
