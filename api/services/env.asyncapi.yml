asyncapi: 2.6.0

info:
  title: Env Microservice Messaging
  version: 1.0.0
  description: |
    Env service handles runtime workspace lifecycle, SSH proxying,
    filesystem operations, and collaborative editing/syncing.

servers:
  nats:
    protocol: nats
    url: nats://localhost:4222

channels:
  env.internal:
    description: Internal control messages for running workspaces
    subscribe:
      summary: Handle internal env operations
      message:
        payload:
          allOf:
            - $ref: "../schemas/env/env-internal-request.yml#/EnvInternalRequest"

  env.msg:
    description: External runtime messages from active workspaces and users
    subscribe:
      summary: Handle user and system env messages
      message:
        payload:
          allOf:
            - $ref: "../schemas/env/env-msg-union.yml#/EnvMsgRequest"
