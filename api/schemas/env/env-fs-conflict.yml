EnvFSConflictResolve:
  type: object
  required: [service, action, payload, correlationId]
  properties:
    service:
      type: string
      const: env
    action:
      type: string
      enum: [fs.conflict.resolve]
    correlationId:
      type: string
    payload:
      type: object
      required: [ino, decision, uuid]
      properties:
        ino:
          type: integer
        decision:
          type: string
          enum: [keep, reload]
        uuid:
          type: string
