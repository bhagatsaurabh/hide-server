UpdateWorkspaceRequest:
  type: object
  required: [id]
  properties:
    id:
      type: integer
    name:
      type: string
      nullable: true
    description:
      type: string
      nullable: true
    members:
      type: array
      items:
        type: string
      nullable: true
    sshKey:
      type: string
      nullable: true
