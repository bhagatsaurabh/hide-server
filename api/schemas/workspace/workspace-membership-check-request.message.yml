WorkspaceMembershipCheckRequest:
  type: object
  properties:
    meta:
      type: object
      properties:
        uid: { type: string }
        sessionId: { type: string, nullable: true }
        requestId: { type: string, nullable: true }
        timestamp: { type: number, nullable: true }
        route: { type: string, nullable: true }
    payload:
      type: object
      required: [uid, uuid]
      properties:
        reqAction:
          type: string
          nullable: true
        uid:
          type: string
        uuid:
          type: string
