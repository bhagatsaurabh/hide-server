Workspace:
  type: object
  required: [id, uuid, name, status, dedicated, createdAt]
  properties:
    id:
      type: integer
      description: Autoincrement DB id
    uuid:
      type: string
      description: Public UUID for workspace
    name:
      type: string
      minLength: 1
    description:
      type: string
      nullable: true
    image:
      type: string
      format: uri
      nullable: true
    status:
      type: string
      enum:
        - PROVISIONING
        - READY
        - DEPROVISIONING
        - COLD
        - DELETING
    dedicated:
      type: boolean
    createdAt:
      type: number
      description: epoch milliseconds
    memberships:
      type: array
      items:
        $ref: "membership.yml#/Membership"
