ErrorBase:
  type: object
  required: [timestamp, status, message, path]
  properties:
    timestamp:
      type: string
      format: date-time
    status:
      type: integer
    message:
      type: string
    path:
      type: string

InvalidAuthHeader:
  allOf:
    - $ref: "#/ErrorBase"
    - properties:
        message:
          const: "INVALID_AUTH_HEADER"
        status:
          const: 400

InvalidToken:
  allOf:
    - $ref: "#/ErrorBase"
    - properties:
        message:
          const: "INVALID_TOKEN"
        status:
          const: 401

InvalidEmail:
  allOf:
    - $ref: "#/ErrorBase"
    - properties:
        message:
          const: "INVALID_EMAIL"
        status:
          const: 400

PinExpired:
  allOf:
    - $ref: "#/ErrorBase"
    - properties:
        message:
          const: "PIN_EXPIRED"
        status:
          const: 400

EmailVerifyCodeWrong:
  allOf:
    - $ref: "#/ErrorBase"
    - properties:
        message:
          const: "EMAIL_VERIFY_CODE_WRONG"
        status:
          const: 400

EmailVerifyCodeMaxAttempts:
  allOf:
    - $ref: "#/ErrorBase"
    - properties:
        message:
          const: "EMAIL_VERIFY_CODE_MAX_ATTEMPTS_REACHED"
        status:
          const: 429

EmailRequestCodeMaxAttempts:
  allOf:
    - $ref: "#/ErrorBase"
    - properties:
        message:
          const: "EMAIL_REQUEST_CODE_MAX_ATTEMPTS_REACHED"
        status:
          const: 429

UnknownError:
  allOf:
    - $ref: "#/ErrorBase"
    - properties:
        message:
          const: "UNKNOWN"
        status:
          const: 500

UserDetailsMissing:
  allOf:
    - $ref: "#/ErrorBase"
    - properties:
        message: { const: "USER_DETAILS_MISSING" }
        status: { const: 400 }

InvalidUserName:
  allOf:
    - $ref: "#/ErrorBase"
    - properties:
        message: { const: "INVALID_USER_NAME" }
        status: { const: 400 }

InvalidUsername:
  allOf:
    - $ref: "#/ErrorBase"
    - properties:
        message: { const: "INVALID_USER_USERNAME" }
        status: { const: 400 }

UserAlreadyRegistered:
  allOf:
    - $ref: "#/ErrorBase"
    - properties:
        message: { const: "USER_ALREADY_REGISTERED" }
        status: { const: 400 }

InvalidUserIdentity:
  allOf:
    - $ref: "#/ErrorBase"
    - properties:
        message: { const: "INVALID_USER_IDENTITY" }
        status: { const: 400 }

UpdateUserForbidden:
  allOf:
    - $ref: "#/ErrorBase"
    - properties:
        message: { const: "UPDATE_USER_FORBIDDEN" }
        status: { const: 400 }

UserNotFound:
  allOf:
    - $ref: "#/ErrorBase"
    - properties:
        message: { const: "USER_NOT_FOUND" }
        status: { const: 404 }

UserDoesNotExist:
  allOf:
    - $ref: "#/ErrorBase"
    - properties:
        message: { const: "USER_DOES_NOT_EXIST" }
        status: { const: 404 }
