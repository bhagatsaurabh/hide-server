ErrorBase:
  type: object
  required: [timestamp, status, message, path]
  properties:
    timestamp:
      type: string
      format: date-time
    status:
      type: integer
    message:
      type: string
    path:
      type: string

InvalidAuthHeader:
  allOf:
    - $ref: "#/ErrorBase"
    - properties:
        message:
          const: "INVALID_AUTH_HEADER"
        status:
          const: 400

InvalidToken:
  allOf:
    - $ref: "#/ErrorBase"
    - properties:
        message:
          const: "INVALID_TOKEN"
        status:
          const: 401

