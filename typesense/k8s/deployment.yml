apiVersion: apps/v1
kind: Deployment
metadata:
  name: typesense
spec:
  replicas: 1
  selector:
    matchLabels:
      app: typesense
  template:
    metadata:
      labels:
        app: typesense
    spec:
      containers:
        - name: typesense
          image: typesense/typesense:28.0
          ports:
            - containerPort: 8108
          volumeMounts:
            - name: typesense-data
              mountPath: /data
          args:
            - "--data-dir"
            - "/data"
            - "--api-key=$(TYPESENSE_API_KEY)"
            - "--enable-cors"
          env:
            - name: TYPESENSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hide-secrets
                  key: TYPESENSE_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8108
            initialDelaySeconds: 7
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: typesense-data
          persistentVolumeClaim:
            claimName: typesense-pvc
