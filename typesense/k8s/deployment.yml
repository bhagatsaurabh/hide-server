apiVersion: apps/v1
kind: Deployment
metadata:
  name: typesense
spec:
  replicas: 1
  selector:
    matchLabels:
      app: typesense
  template:
    metadata:
      labels:
        app: typesense
    spec:
      containers:
        - name: typesense
          image: typesense/typesense:28.0
          ports:
            - containerPort: 8108
          volumeMounts:
            - name: typesense-data
              mountPath: /data
          command: ["/bin/sh", "-c"]
          args:
            [
              "typesense --data-dir /data --api-key=$TYPESENSE_API_KEY --enable-cors",
            ]
          env:
            - name: TYPESENSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hide-secrets
                  key: TYPESENSE_API_KEY
          resources:
            limits:
              cpu: 500m
              memory: 500M
            requests:
              cpu: 500m
              memory: 500M
      volumes:
        - name: typesense-data
          persistentVolumeClaim:
            claimName: typesense-pvc
