services:
  typesense:
    image: typesense/typesense:28.0
    container_name: typesense
    ports:
      - 8108:8108
    environment:
      GLOG_minloglevel: 1
    volumes:
      - ./.typesense-data:/data
    command: "--data-dir /data --api-key=test --enable-cors"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 0.25g
        reservations:
          cpus: "0.25"
          memory: 0.25g
