apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioner-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provisioner
  template:
    metadata:
      labels:
        app: provisioner
    spec:
      serviceAccountName: provisioner
      containers:
        - name: provisioner
          image: hideregistry.azurecr.io/hide-server-provisioner:latest
          # imagePullPolicy: Never
          ports:
            - containerPort: 80
          env:
            - name: SERVICE_PORT
              value: "80"
      imagePullSecrets:
        - name: acr-secret
