apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioner-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provisioner
  template:
    metadata:
      labels:
        app: provisioner
    spec:
      serviceAccountName: provisioner-sa
      containers:
        - name: provisioner
          image: hideregistry.azurecr.io/hide-server-provisioner:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: SERVICE_PORT
              value: "80"
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: IN_CLUSTER_K8S_CONFIG
              value: "true"
          resources:
            limits:
              cpu: 500m
              memory: 500M
            requests:
              cpu: 500m
              memory: 500M
      imagePullSecrets:
        - name: acr-secret
