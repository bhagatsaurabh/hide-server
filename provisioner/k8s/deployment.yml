apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioner
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provisioner
  template:
    metadata:
      labels:
        app: provisioner
    spec:
      serviceAccountName: provisioner-sa
      containers:
        - name: provisioner
          image: hideregistry.azurecr.io/hide-server-provisioner:latest
          imagePullPolicy: Always
          ports:
            - name: api
              containerPort: 80
            - name: ssh
              containerPort: 22
          env:
            - name: SERVICE_PORT
              value: "80"
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: WORKSPACE_CPU_REQUEST
              value: "200"
            - name: IDLE_THRESHOLD_CPU
              value: "350"
            - name: PREEMPT_SPOT_OLDER_THAN_HOURS
              value: "12"
            - name: LOG_LEVEL
              value: "debug"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 150m
              memory: 256Mi
            requests:
              cpu: 150m
              memory: 256Mi
      imagePullSecrets:
        - name: acr-secret
