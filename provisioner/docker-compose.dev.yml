services:
  provisioner:
    expose:
      - 80
    build:
      context: .
      dockerfile: dockerfile
      target: development
    image: hide-server-provisioner
    volumes:
      - .:/app
      - ~/.kube:/root/.kube
      - /app/.build
    env_file:
      - .env
    environment:
      - SERVICE_PORT=80
      - K8S_API_SERVER=https://kubernetes.docker.internal:6443
      - DOCKER_HOST=tcp://host.docker.internal:2375
      - DEV_PLATFORM=docker
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NATS_URL=nats://nats:4222
    command: ["/bin/sh", "-c", "air -c .air.toml"]
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: 0.5g
        reservations:
          cpus: "0.6"
          memory: 0.5g
