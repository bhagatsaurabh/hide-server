services:
  provisioner:
    expose:
      - 80
    build:
      context: .
      dockerfile: dockerfile
      target: development
    image: hide-server-provisioner
    volumes:
      - .:/app
      - ~/.kube:/root/.kube
      - /app/.build
    environment:
      SERVICE_PORT: 80
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NATS_URL: nats://nats:4222
      K8S_API_SERVER: https://kubernetes.docker.internal:6443
      DOCKER_HOST: tcp://host.docker.internal:2375
      DEV_PLATFORM: docker
      DEV_FS_SOURCE: "${DEV_FS_SOURCE}"
    command: ["/bin/sh", "-c", "air -c .air.toml"]
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: 0.5g
        reservations:
          cpus: "0.6"
          memory: 0.5g
