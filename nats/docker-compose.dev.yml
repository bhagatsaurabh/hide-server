services:
  nats:
    image: nats:2.11.10-alpine
    container_name: nats
    expose:
      - 4222
      - 6222
    ports:
      - 8222:8222
      - 4222:4222
      - 6222:6222
    volumes:
      - ./.nats-data:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
