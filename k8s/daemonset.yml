apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hide-lv-mounter
  namespace: hide-system
spec:
  selector:
    matchLabels:
      app: hide-lv-mounter
  template:
    metadata:
      labels:
        app: hide-lv-mounter
    spec:
      hostPID: true
      hostNetwork: true
      containers:
        - name: hide-lv-mounter
          image: "hideregistry.azurecr.io/hide-server-util-lvm:latest"
          securityContext:
            privileged: true
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: sys
              mountPath: /sys
            - name: proc
              mountPath: /proc
            - name: host-volumes
              mountPath: /host-volumes
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              vgchange -ay workspace-vg || true

              while true; do
                active_lvs=$(lvs --noheadings -o lv_name workspace-vg | awk '{$1=$1};1')

                for lv in $active_lvs; do
                  dev="/dev/workspace-vg/$lv"
                  uuid="${lv%-*}"
                  subdir="${lv##*-}"
                  target="/host-volumes/workspaces/$uuid/$subdir"
                  mkdir -p "$target"
                  if ! mountpoint -q "$target"; then
                    echo "Mounting $dev -> $target"
                    mount "$dev" "$target" || true
                  fi
                done

                for dir in /host-volumes/workspaces/*; do
                  [ -d "$dir" ] || continue
                  uuid=$(basename "$dir")
                  dev="/dev/workspace-vg/$uuid-data"
                  if [ ! -e "$dev" ]; then
                    if mountpoint -q "$dir/data"; then
                      echo "Unmounting stale $dir/data"
                      umount -f "$dir/data" || true
                    fi
                    if [ -z "$(ls -A "$dir/data" 2>/dev/null)" ]; then
                      echo "Removing empty dir $dir/data"
                      rmdir "$dir/data" || true
                    fi
                  fi
                  dev="/dev/workspace-vg/$uuid-config"
                  if [ ! -e "$dev" ]; then
                    if mountpoint -q "$dir/config"; then
                      echo "Unmounting stale $dir/config"
                      umount -f "$dir/config" || true
                    fi
                    if [ -z "$(ls -A "$dir/config" 2>/dev/null)" ]; then
                      echo "Removing empty dir $dir/config"
                      rmdir "$dir/config" || true
                    fi
                  fi
                  if [ -z "$(ls -A "$dir" 2>/dev/null)" ]; then
                    echo "Removing empty dir $dir"
                    rmdir "$dir" || true
                  fi
                done
                sleep 3600
              done
      resources:
        limits:
          cpu: 100m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 256Mi
      volumes:
        - name: dev
          hostPath:
            path: /dev
        - name: sys
          hostPath:
            path: /sys
        - name: proc
          hostPath:
            path: /proc
        - name: host-volumes
          hostPath:
            path: /data/workspace-volumes
            type: DirectoryOrCreate
      imagePullSecrets:
        - name: acr-secret
