apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hide-lv-mounter
  namespace: hide-system
spec:
  selector:
    matchLabels:
      app: hide-lv-mounter
  template:
    metadata:
      labels:
        app: hide-lv-mounter
    spec:
      hostPID: true
      hostNetwork: true
      containers:
        - name: hide-lv-mounter
          image: "hideregistry.azurecr.io/hide-server-util-lvm:latest"
          securityContext:
            privileged: true
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: sys
              mountPath: /sys
            - name: proc
              mountPath: /proc
            - name: host-volumes
              mountPath: /host-volumes
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              VG="workspace-vg"
              BASE="/host-volumes/workspaces"

              while true; do
                lvs --noheadings -o lv_name "$VG" | awk '{$1=$1}' | while read -r lv; do
                  dev="/dev/$VG/$lv"
                  uuid="${lv%-*}"
                  subdir="${lv##*-}"
                  target="$BASE/$uuid/$subdir"

                  [ -e "$dev" ] || continue

                  if ! lvs --noheadings -o lv_attr "$VG/$lv" | grep -q "^..a"; then
                    lvchange -ay "$dev" 2>/dev/null || true
                  fi

                  mkdir -p "$target"

                  if [ -f "/host-volumes/.delete-$uuid" ]; then
                    continue
                  fi
                  if ! mountpoint -q "$target"; then
                    echo "Mounting $dev -> $target"
                    mount -o defaults,nofail "$dev" "$target" 2>/dev/null || true
                  fi
                done

                for dir in $BASE/*; do
                  [ -d "$dir" ] || continue
                  uuid=$(basename "$dir")

                  for sub in data config; do
                    d="$dir/$sub"
                    dev="/dev/$VG/$uuid-$sub"
                    if [ ! -e "$dev" ]; then
                      if mountpoint -q "$d"; then
                        echo "Unmounting stale $d"
                        umount -l "$d" || true
                      fi
                      [ -d "$d" ] && rmdir "$d" 2>/dev/null || true
                    fi
                  done
                  [ -d "$dir" ] && rmdir "$dir" 2>/dev/null || true
                done
                sleep 1800
              done
      resources:
        limits:
          cpu: 100m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 256Mi
      volumes:
        - name: dev
          hostPath:
            path: /dev
        - name: sys
          hostPath:
            path: /sys
        - name: proc
          hostPath:
            path: /proc
        - name: host-volumes
          hostPath:
            path: /data/workspace-volumes
            type: DirectoryOrCreate
      imagePullSecrets:
        - name: acr-secret
