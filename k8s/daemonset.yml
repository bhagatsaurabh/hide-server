apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hide-lv-mounter
  namespace: hide-system
spec:
  selector:
    matchLabels:
      app: hide-lv-mounter
  template:
    metadata:
      labels:
        app: hide-lv-mounter
    spec:
      hostPID: true
      hostNetwork: true
      containers:
        - name: hide-lv-mounter
          image: debian:bookworm-slim
          securityContext:
            privileged: true
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: sys
              mountPath: /sys
            - name: proc
              mountPath: /proc
            - name: host-volumes
              mountPath: /host-volumes
            - name: host-disks
              mountPath: /var/lib/k8s-disks
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              apt-get update && apt-get install -y lvm2 util-linux

              losetup -fP /var/lib/k8s-disks/workspaces.img || true
              vgchange -ay

              while true; do
                active_lvs=$(lvs --noheadings -o lv_name k8s-vg | awk '{$1=$1};1')

                for lv in $active_lvs; do
                  dev="/dev/k8s-vg/$lv"
                  target="/host-volumes/$lv"
                  mkdir -p "$target"
                  if ! mountpoint -q "$target"; then
                    echo "Mounting $dev -> $target"
                    mount "$dev" "$target" || true
                  fi
                done

                for dir in /host-volumes/*; do
                  [ -d "$dir" ] || continue
                  name=$(basename "$dir")
                  dev="/dev/k8s-vg/$name"

                  if [ ! -e "$dev" ]; then
                    if mountpoint -q "$dir"; then
                      echo "Unmounting stale $dir"
                      umount -f "$dir" || true
                    fi
                    if [ -z "$(ls -A "$dir" 2>/dev/null)" ]; then
                      echo "Removing empty dir $dir"
                      rmdir "$dir" || true
                    fi
                  fi
                done
                sleep 3600
              done
      volumes:
        - name: dev
          hostPath:
            path: /dev
        - name: sys
          hostPath:
            path: /sys
        - name: proc
          hostPath:
            path: /proc
        - name: host-volumes
          hostPath:
            path: /var/lib/k8s-volumes
            type: DirectoryOrCreate
        - name: host-disks
          hostPath:
            path: /var/lib/k8s-disks
            type: DirectoryOrCreate
