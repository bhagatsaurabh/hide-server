name: CD - Deploy to K3s

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (e.g., staging/prod)"
        required: true
        default: "staging"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build metadata
        uses: actions/download-artifact@v4
        with:
          name: images

      - name: Install tools
        run: |
          sudo snap install yq
          curl -sLO "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.2/kustomize_v5.4.2_linux_amd64.tar.gz"
          tar -xzf kustomize_v5.4.2_linux_amd64.tar.gz
          sudo mv kustomize /usr/local/bin/

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.31.0

      - name: Deploy services with Kustomize
        run: |
          while read -r IMAGE; do
            SERVICE=$(basename $IMAGE | cut -d: -f1)
            echo "Deploying $SERVICE with image $IMAGE"
            kustomize edit set image $SERVICE=$IMAGE
          done < images.txt
          kubectl apply -k k8s/overlays/${{ github.event.inputs.environment }}

      - name: Restart dependent services
        run: bash .github/scripts/restart-deps.sh
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
