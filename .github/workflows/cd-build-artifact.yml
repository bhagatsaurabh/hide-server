name: CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy environment"
        required: true
        default: "staging"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download build metadata
        uses: actions/download-artifact@v4
        with:
          name: images

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.31.0

      - name: Deploy with Kustomize
        run: |
          while read -r IMAGE; do
            SERVICE=$(basename $IMAGE | cut -d: -f1)
            echo "Deploying $SERVICE with image $IMAGE"
            kustomize edit set image $SERVICE=$IMAGE
          done < images.txt
          kubectl apply -k k8s/overlays/${{ github.event.inputs.environment }}

      - name: Restart dependent services
        run: |
          # Example: service-b depends on service-a
          if grep -q "service-a" images.txt; then
            echo "Restarting dependent services..."
            kubectl rollout restart deployment service-b
            kubectl rollout restart deployment service-c
          fi
