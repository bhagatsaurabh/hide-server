name: Deploy Services

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated list of services to deploy (gateway, env, user, notification, workspace, auth, provisioner, lease-controller). Leave blank to use paths-filter."
        required: false
        default: ""

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          services="${{ github.event.inputs.services }}"
          json=$(printf '[%s]' "$(echo "$services" | sed 's/[^,][^,]*/"&"/g')")
          echo "matrix=$json" >> $GITHUB_OUTPUT
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${K3S_KUBECONFIG}" > ~/.kube/config
        env:
          K3S_KUBECONFIG: ${{ secrets.K3S_KUBECONFIG }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy ${{ matrix.service }}
        run: |
          kubectl apply -k ${{ matrix.service }}/k8s/
          kubectl rollout status deployment -n default -l app=${{ matrix.service }} --timeout=60s
