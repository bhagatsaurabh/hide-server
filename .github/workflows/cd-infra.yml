name: Deploy Infra

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated list of infra services to deploy (postgres, redis, rabbitmq, nats, typesense, k8s, logging). Leave blank to use paths-filter."
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - "k8s/**"
      - "postgres/k8s/**"
      - "redis/k8s/**"
      - "rabbitmq/k8s/**"
      - "nats/k8s/**"
      - "typesense/k8s/**"
      - "logging/k8s/**"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        name: Filter
        id: filter
        with:
          filters: |
            k8s:
              - 'k8s/**'
            redis:
              - 'redis/k8s/**'
            postgres:
              - 'postgres/k8s/**'
            rabbitmq:
              - 'rabbitmq/k8s/**'
            nats:
              - 'nats/k8s/**'
            typesense:
              - 'typesense/k8s/**'
            logging:
              - 'logging/k8s/**'

  prepare:
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
    steps:
      - id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            input="${{ github.event.inputs.services }}"
            json=$(jq -nc --arg input "$input" '$input | split(",")')
            echo "services=$json" >> $GITHUB_OUTPUT
          else
            echo 'services=${{ needs.changes.outputs.matrix }}' >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: [changes, prepare]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${K3S_KUBECONFIG}" > ~/.kube/config
        env:
          K3S_KUBECONFIG: ${{ secrets.K3S_KUBECONFIG }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy Configs
        if: >
          matrix.service == 'k8s' &&
          (
            (github.event_name == 'workflow_dispatch' && github.event.inputs.services != '' && contains(github.event.inputs.services, 'k8s')) ||
            (github.event_name == 'push' && contains(fromJSON(needs.changes.outputs.matrix), 'k8s'))
          )
        run: |
          export FIREBASE_KEY_BASE64=$(echo "$FIREBASE_KEY_BASE64" | tr -d '\r')
          export POSTGRES_PASSWORD=$(echo "$POSTGRES_PASSWORD" | tr -d '\r')
          export TYPESENSE_API_KEY=$(echo "$TYPESENSE_API_KEY" | tr -d '\r')
          export WORKSPACE_SERVICE_SECRET=$(echo "$WORKSPACE_SERVICE_SECRET" | tr -d '\r')
          export AZURE_COMM_EMAIL_CONNECTION=$(echo "$AZURE_COMM_EMAIL_CONNECTION" | tr -d '\r')
          export AZURE_CS_SMTP_SECRET=$(echo "$AZURE_CS_SMTP_SECRET" | tr -d '\r')
          export JWT_PUBLIC_KEY=$(echo "$JWT_PUBLIC_KEY" | tr -d '\r')
          export ACR_KEY_BASE64=$(echo "$ACR_KEY_BASE64" | tr -d '\r')
          export GRAFANA_GITHUB_CLIENT_ID=$(echo "$GRAFANA_GITHUB_CLIENT_ID" | tr -d '\r')
          export GRAFANA_GITHUB_CLIENT_SECRET=$(echo "$GRAFANA_GITHUB_CLIENT_SECRET" | tr -d '\r')

          envsubst < k8s/secret.yml > k8s/secret-values.yml
          rm k8s/secret.yml
          mv k8s/secret-values.yml k8s/secret.yml
          kubectl apply -k k8s/
        env:
          FIREBASE_KEY_BASE64: ${{ secrets.FIREBASE_KEY_BASE64 }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          TYPESENSE_API_KEY: ${{ secrets.TYPESENSE_API_KEY }}
          WORKSPACE_SERVICE_SECRET: ${{ secrets.WORKSPACE_SERVICE_SECRET }}
          AZURE_COMM_EMAIL_CONNECTION: ${{ secrets.AZURE_COMM_EMAIL_CONNECTION }}
          AZURE_CS_SMTP_SECRET: ${{ secrets.AZURE_CS_SMTP_SECRET }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          ACR_KEY_BASE64: ${{ secrets.ACR_KEY_BASE64 }}
          GRAFANA_GITHUB_CLIENT_ID: ${{ secrets.GRAFANA_GITHUB_CLIENT_ID }}
          GRAFANA_GITHUB_CLIENT_SECRET: ${{ secrets.GRAFANA_GITHUB_CLIENT_SECRET }}

      - name: Deploy ${{ matrix.service }}
        if: >
          (github.event_name == 'workflow_dispatch' && github.event.inputs.services != '' && contains(github.event.inputs.services, matrix.service) && matrix.service != 'k8s') ||
          (github.event_name == 'push' && contains(fromJSON(needs.changes.outputs.matrix), matrix.service) && matrix.service != 'k8s')
        run: |
          kubectl apply -k ${{ matrix.service }}/k8s/
          kubectl rollout status deployment -n default -l app=${{ matrix.service }} --timeout=60s
