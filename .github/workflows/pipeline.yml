name: Reference

on:
  workflow_dispatch:
  # push:
  #   branches: ["main"]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      auth: ${{ steps.filter.outputs.auth }}
      notification: ${{ steps.filter.outputs.notification }}
      workspace: ${{ steps.filter.outputs.workspace }}
      provisioner: ${{ steps.filter.outputs.provisioner }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gateway:
              - 'gateway/**'
            auth:
              - 'auth/**'
            notification:
              - 'notification/**'
            workspace:
              - 'workspace/**'
            provisioner:
              - 'provisioner/**'

  deploy:
    needs: detect-changes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Build only changed images ---
      - name: Build Gateway
        if: needs.detect-changes.outputs.gateway == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          push: true
          tags: ghcr.io/${{ github.repository }}/gateway:${{ github.sha }}

      - name: Build Auth
        if: needs.detect-changes.outputs.auth == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./auth
          push: true
          tags: ghcr.io/${{ github.repository }}/auth:${{ github.sha }}

      - name: Build Notification
        if: needs.detect-changes.outputs.notification == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./notification
          push: true
          tags: ghcr.io/${{ github.repository }}/notification:${{ github.sha }}

      - name: Build Workspace
        if: needs.detect-changes.outputs.workspace == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./workspace
          push: true
          tags: ghcr.io/${{ github.repository }}/workspace:${{ github.sha }}

      - name: Build Provisioner
        if: needs.detect-changes.outputs.provisioner == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./provisioner
          push: true
          tags: ghcr.io/${{ github.repository }}/provisioner:${{ github.sha }}

      # --- Setup cluster tools ---
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Install Kustomize
        run: |
          curl -sfLo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.1/kustomize_v5.4.1_linux_amd64.tar.gz
          tar -xvzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/

      # --- Deploy changed + dependents ---
      - name: Deploy changes
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/deploy.py \
            "$(echo gateway=${{ needs.detect-changes.outputs.gateway }},auth=${{ needs.detect-changes.outputs.auth }},notification=${{ needs.detect-changes.outputs.notification }},workspace=${{ needs.detect-changes.outputs.workspace }},provisioner=${{ needs.detect-changes.outputs.provisioner }} | tr , '\n' | awk -F= '$2=="true"{print $1}' | paste -sd, -)" \
            "${{ github.sha }}"
