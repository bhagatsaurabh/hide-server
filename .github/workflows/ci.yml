name: Build

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated list of services to build (gateway, env, user, notification, workspace, auth, provisioner, lease-controller). Leave blank to use paths-filter."
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - "gateway/**"
      - "env/**"
      - "user/**"
      - "notification/**"
      - "workspace/**"
      - "auth/**"
      - "provisioner/**"
      - "lease-controller/**"
      - "!**/k8s/**"
      - "!logging/**"
      - "!**/docker-compose.dev.yml"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        name: Filter
        id: filter
        with:
          predicate-quantifier: "every"
          filters: |
            gateway:
              - 'gateway/**'
              - '!gateway/k8s/**'
            env:
              - 'env/**'
              - '!env/k8s/**'
            user:
              - 'user/**'
              - '!user/k8s/**'
            notification:
              - 'notification/**'
              - '!notification/k8s/**'
            workspace:
              - 'workspace/**'
              - '!workspace/k8s/**'
            auth:
              - 'auth/**'
              - '!auth/k8s/**'
            provisioner:
              - 'provisioner/**'
              - '!provisioner/k8s/**'
            lease-controller:
              - 'lease-controller/**'
              - '!lease-controller/k8s/**'

  prepare:
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
    steps:
      - id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            input="${{ github.event.inputs.services }}"
            json=$(jq -nc --arg input "$input" '$input | split(",")')
            echo "services=$json" >> $GITHUB_OUTPUT
          else
            echo 'services=${{ needs.changes.outputs.matrix }}' >> $GITHUB_OUTPUT
          fi

  build:
    needs: [changes, prepare]
    # runs-on: ubuntu-24.04-arm # not for private repos 😭
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Service Principal Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service }}/dockerfile
          target: production
          push: true
          platforms: linux/arm64
          tags: |
            ${{ secrets.REGISTRY_LOGIN_SERVER }}/hide-server-${{ matrix.service }}:latest
