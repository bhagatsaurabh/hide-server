name: Build

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        name: Filter
        id: filter
        with:
          filters: |
            gateway:
              - 'gateway/**'
            env:
              - 'env/**'
            user:
              - 'user/**'
            notification:
              - 'notification/**'
            workspace:
              - 'workspace/**'
            auth:
              - 'auth/**'
            provisioner:
              - 'provisioner/**'
            postgres:
              - 'postgres/**'
            typesense:
              - 'typesense/**'
            redis:
              - 'redis/**'
            nats:
              - 'nats/**'
            rabbitmq:
              - 'rabbitmq/**'

  build:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Service Principal Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - run: |
          IMAGE=${{ secrets.REGISTRY_LOGIN_SERVER }}/hide-server-${{ matrix.service }}:latest
          cd ${{ matrix.service }}
          docker build --target production -f dockerfile -t $IMAGE ..
          docker push $IMAGE
          echo $IMAGE >> built.txt

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: built
          path: built.txt
