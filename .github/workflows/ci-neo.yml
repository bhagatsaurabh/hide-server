name: CI - Build & Push to ACR

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'gateway/**'
            auth:
              - 'auth/**'
            notification:
              - 'notification/**'
            workspace:
              - 'workspace/**'
            provisioner:
              - 'provisioner/**'

  build:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
          registry: myacr.azurecr.io

      - name: Build and push Docker image
        run: |
          IMAGE=myacr.azurecr.io/${{ matrix.service }}:${{ github.sha }}
          docker build ./services/${{ matrix.service }} -t $IMAGE
          docker push $IMAGE
          echo $IMAGE >> images.txt

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: images
          path: images.txt
