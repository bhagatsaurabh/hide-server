spring.application.name=auth
server.port=80
spring.mvc.servlet.load-on-startup=1
azure.communication.email.connection-string=${AZURE_COMM_EMAIL_CONNECTION}
spring.mail.host=smtp.azurecomm.net
spring.mail.port=587
spring.mail.username=${AZURE_COMM_EMAIL_USERNAME}
spring.mail.password=${AZURE_CS_SMTP_SECRET}
spring.mail.properties.mail.smtp.starttls.enable=true
redis.host=${REDIS_HOST}
redis.port=${REDIS_PORT}
