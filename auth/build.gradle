plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'me.saurabhagat.hide'
version = '0.0.1-SNAPSHOT'

/* java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
} */

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2024.0.0")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.google.firebase:firebase-admin:9.4.3'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    implementation(platform("com.azure:azure-sdk-bom:1.2.37"))
    implementation("com.azure:azure-communication-email:1.2.0-beta.1")
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named("jar") {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform()
}

task image(type: Exec) {
    commandLine 'docker', 'build', '--target', 'production', '-f', 'dockerfile', '-t', 'hide-server-auth-release:latest', '.'
}