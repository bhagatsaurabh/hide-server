services:
  auth:
    expose:
      - 80
    build:
      context: .
      dockerfile: dockerfile
      target: development
    image: hide-server-auth
    volumes:
      - .:/app
      - /app/build
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
      SPRING_PROFILES_ACTIVE: local
      FIREBASE_AUTH_EMULATOR_HOST: "host.docker.internal:9099"
    command: ./gradlew bootRun --no-daemon
