services:
  workspace:
    expose:
      - 80
    build:
      context: ../
      dockerfile: workspace/dockerfile
      target: development
    volumes:
      - .:/app/workspace
      - /app/workspace/node_modules
    environment:
      NODE_ENV: development
      SERVICE_PORT: 80
      RMQ_URL: 'amqp://rabbitmq:5672'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NATS_URL: 'nats://nats:4222'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: workspacedb
      WORKSPACE_SERVICE_SECRET: ${WORKSPACE_SERVICE_SECRET}
