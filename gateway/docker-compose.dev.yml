services:
  gateway:
    ports:
      - 3001:80
    build:
      context: ../
      dockerfile: gateway/dockerfile
      target: development
    image: hide-server-gateway
    volumes:
      - .:/app/gateway
      - /app/gateway/node_modules
    environment:
      - NODE_ENV=development
      - SERVICE_PORT=80
      - RMQ_URL=amqp://rabbitmq:5672
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: [ "/bin/sh", "-c", "cd gateway && npm run start:dev" ]
