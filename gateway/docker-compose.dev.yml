services:
  gateway:
    extends:
      file: docker-compose.yml
      service: gateway
    build:
      context: .
      target: development
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - EUREKA_HOST=service-registry
      - EUREKA_PORT=8761
    command: npm run start:dev
