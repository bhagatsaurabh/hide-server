apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: hideregistry.azurecr.io/hide-server-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: NODE_ENV
              value: production
            - name: SERVICE_PORT
              value: "80"
            - name: CORS_ORIGIN
              value: "hide.saurabhagat.me"
            - name: RMQ_URL
              value: "amqp://rabbitmq:5672"
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: FIREBASE_APP_ID
              value: "hide-43a4b"
            - name: WORKSPACE_PING_TIMEOUT
              value: "20000"
            - name: WORKSPACE_ACTIVITY_TIMEOUT
              value: "3600000"
            - name: SESSION_PING_TIMEOUT
              value: "20000"
            - name: SESSION_ACTIVITY_TIMEOUT
              value: "3600000"
            - name: FIREBASE_KEY_BASE64
              valueFrom:
                secretKeyRef:
                  name: hide-secrets
                  key: FIREBASE_KEY_BASE64
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: hide-secrets
                  key: JWT_PUBLIC_KEY
          readinessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 500Mi
            requests:
              cpu: 500m
              memory: 500Mi
      imagePullSecrets:
        - name: acr-secret
