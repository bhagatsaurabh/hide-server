apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: hideregistry.azurecr.io/hide-server-gateway:latest
          # imagePullPolicy: Never
          ports:
            - containerPort: 80
          env:
            - name: NODE_ENV
              value: production
            - name: SERVICE_PORT
              value: '80'
            - name: CORS_ORIGIN
              value: '*'
            - name: RMQ_URL
              value: 'amqp://rabbitmq:5672'
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: '6379'
      imagePullSecrets:
        - name: acr-secret
      initContainers:
        - name: init-redis
          image: busybox:1.28
          command:
            [
              'sh',
              '-c',
              'until nslookup redis.default.svc.cluster.local; do echo waiting for redis; sleep 2; done',
            ]
        - name: init-rmq
          image: busybox:1.28
          command:
            [
              'sh',
              '-c',
              'until nslookup rabbitmq.default.svc.cluster.local; do echo waiting for rabbitmq; sleep 2; done',
            ]
